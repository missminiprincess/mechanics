[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanics"
version = "0.1.0"
description = "CR3BP simulations and visualizations for Sun-Earth Lagrange points"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "plotly>=6.0",
  "scipy>=1.13",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "ipython>=8.18",
  "mypy>=1.19",
  "ruff>=0.15",
]

[project.scripts]
mechanics = "mechanics.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.9"
files = ["src", "code/src"]
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
