repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy mechanics
        language: python
        additional_dependencies:
          - "matplotlib>=3.9"
          - "mypy>=2.0"
          - "numpy>=2.0"
          - "plotly>=6.0"
          - "scipy>=1.13"
          - "typer>=0.12"
        types_or: [python, pyi]
        pass_filenames: false
